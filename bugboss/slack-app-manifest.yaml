## The Slack app BugBoss runs as.
##
## Create it at https://api.slack.com/apps -> Create New App -> From an app
## manifest, and paste this. Checking it in means the scopes are reviewable
## and the next person does not have to reverse-engineer them from the code.
##
## ORDERING: Slack verifies `request_url` the moment you save, by posting a
## challenge to it. So either deploy BugBoss first, or delete the
## `event_subscriptions` block below, create the app, deploy, and add it back.
## BugBoss answers the challenge (`http/public.ts`), so verification succeeds
## as soon as the URL is reachable.
##
## This file is not applied by anything. Changing it changes nothing until
## somebody pastes it into the live app at api.slack.com.
##
## Scopes are derived from the Slack API methods BugBoss actually calls and the
## two events it handles. Nothing here is aspirational. chat.getPermalink, which
## is how a merged or split incident links to the other thread, requires no
## scope at all, so it adds nothing below.
##
## CHANGING THE SCOPES MEANS REINSTALLING THE APP. A scope added here does
## nothing until someone reinstalls BugBoss into the workspace; until then the
## method behind it fails with `missing_scope` at runtime.

display_information:
  name: BugBoss
  description: Works incidents from Grafana alerts, in a thread per incident.
  background_color: "#1f2933"

features:
  bot_user:
    display_name: BugBoss
    ## Threads stay readable when the bot is not marked away mid-incident.
    always_online: true

oauth_config:
  scopes:
    bot:
      ## chat.postMessage: every incident thread, transition and question.
      ## chat.update: the status header above an incident thread's top-level
      ## message. Editing a message the bot itself posted needs no scope
      ## beyond this one, so the board added nothing here and needs no
      ## reinstall.
      - chat:write
      ## conversations.replies, so the Slack agent can read a thread before
      ## answering in it. Also required to receive message.channels.
      - channels:history
      ## The app_mention event, which is how @bugboss reaches it.
      - app_mentions:read
      ## reactions.add, for the :eyes: BugBoss puts on a message the moment
      ## it takes it, before the work that answers it. The reaction is never
      ## removed or read back, so reactions.remove and reactions:read stay
      ## uncalled even though this scope would cover the first of them.
      - reactions:write
      ## files.getUploadURLExternal and files.completeUploadExternal, for the
      ## closing report BugBoss posts into an incident thread as a Markdown
      ## file when the incident reaches CLOSED. (files.upload is deprecated;
      ## the two-call external flow is what replaced it, and both calls sit
      ## behind this one scope.) Without it the upload fails with
      ## missing_scope and the report is posted as thread text instead --
      ## nothing is lost, it is just longer to read.
      - files:write
      ## Granted on the installed app already (docs/bugboss-todo.md), and
      ## listed here because this file is what a reinstall applies -- leaving
      ## it out would quietly drop a live scope the next time somebody
      ## reinstalls. Nothing calls it yet: the Boss writes the report and a
      ## person opens it. It is the scope a future reader of the thread's own
      ## files would need.
      - files:read
      ## usergroups.users.list, for the rotation snapshot recorded on each
      ## incident at open. A Slack user group keeps no history, so this is
      ## the only moment that answer exists.
      - usergroups:read

settings:
  event_subscriptions:
    request_url: https://bugboss.goodparty.org/slack
    bot_events:
      ## A plain reply in an incident thread. Every one reaches the Boss,
      ## tagged or not, so talking about an incident needs no ceremony.
      - message.channels
      ## @bugboss anywhere. Routes to the Boss.
      - app_mention
  org_deploy_enabled: false
  ## BugBoss is an HTTPS endpoint behind an ALB, not a socket client.
  socket_mode_enabled: false
  token_rotation_enabled: false
