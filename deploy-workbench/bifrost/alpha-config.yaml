# oauth2-proxy alpha configuration for the Bifrost admin-surface sidecar
# (phase 1 item 9 of docs/bifrost-gateway.md, revised by the change that turned
# Bifrost's own dashboard auth off).
#
# Baked into the derived image at /etc/oauth2-proxy/alpha-config.yaml, and the
# path the sidecar's `--alpha-config` flag names (deploy-workbench/ecs.ts,
# `OAUTH2_PROXY_COMMAND`). At v7.15.5 the flags that configure the provider,
# the upstreams and the listen address are *removed* when --alpha-config is
# given (docs/docs/configuration/alpha_config.md, "Removed options"), so they
# move here and must not also appear as `OAUTH2_PROXY_*` variables — a removed
# option is silently ignored, which is the failure that looks like it
# deployed. Everything this file does not carry stays an environment variable
# in `OAUTH2_PROXY_ENVIRONMENT` (ecs.ts): the allowlist file, the redirect URL,
# the whitelist domain, the cookie settings and `reverse-proxy` all survived
# into the core option set.
#
# Two values are deliberately literal rather than templated: the listen
# address and the upstream URI. `oauth2-proxy-image.test.ts` pins them to
# `OAUTH2_PROXY_PORT` and `BIFROST_PORT` in `deploy-workbench/network.ts`, so a
# port change fails a test instead of leaving the proxy on a port nothing
# routes to. The file is what runs, so it says what it does.

providers:
  # One provider, which is all this tag supports: "Multiple-providers is not
  # yet working" (pkg/apis/options/alpha_options.go:44-47).
  - id: google
    provider: google
    # The Google client pair comes from Secrets Manager as environment
    # variables. Alpha config substitutes `${...}` at load time (upstream uses
    # github.com/a8m/envsubst for exactly this: pkg/apis/options/load.go:131),
    # which is the documented way to keep a secret out of this file. Google
    # issues these as base64url tokens with no `$` in them, so the substitution
    # is literal; a provider that shipped a `$`-bearing secret would need the
    # `clientSecretFile` form instead.
    clientID: ${OAUTH2_PROXY_CLIENT_ID}
    clientSecret: ${OAUTH2_PROXY_CLIENT_SECRET}

upstreamConfig:
  upstreams:
    # Bifrost in the same task: the two containers share the network
    # namespace, so this is a loopback hop with no round trip through the ALB.
    # `id` is a name rather than the legacy conversion's path, because it is
    # what appears in the proxy's logs and metrics.
    - id: bifrost
      path: "/"
      uri: http://127.0.0.1:8080

server:
  # 0.0.0.0, not the 127.0.0.1 default: the ALB reaches this container through
  # the task's elastic network interface, not through loopback.
  bindAddress: 0.0.0.0:4180

# Why this file still injects a header after Bifrost's own dashboard auth was
# turned off.
#
# `governance.auth_config.is_enabled` is false, so oauth2-proxy is the only
# gate a human passes. But at v2.3.0 "auth disabled" is not "API open": the OSS
# server installs `SetupLockMiddleware` whenever dashboard auth is not active
# (`transports/bifrost-http/handlers/middlewares.go`), and it refuses every
# non-public /api call that does not carry the operator's setup token in
# `X-Bifrost-Setup-Token` (or the HttpOnly setup-session cookie minted from
# it). Without this header the admin surface would work only after a second
# prompt for that token — the setup page, not the dashboard — which is exactly
# the second gate this design exists to remove.
#
# So the sidecar presents the token the task already injects from
# `bifrost/gateway`, and the human path is Google SSO plus the committed
# allowlist, once. The token is what proves operator control for re-enabling
# auth (`PUT /api/config` with an `auth_config` block); it is held by the
# deployment, never typed by a person, and never reaches the browser.
#
# `fromEnv`, not `value`: the value is a secret, and `value` would put it in
# this file. `BIFROST_SETUP_TOKEN` is injected into this container by the task
# definition from `bifrost/gateway`, and oauth2-proxy validates a `fromEnv`
# source at startup and refuses to run when the variable is empty
# (pkg/validation/common.go:25-30), which is the fail-closed half of it. The
# wrapper that used to compute a Basic credential here is gone: with dashboard
# auth off there is no password to encode, and the token is already an
# environment variable.
#
# `preserveRequestValue` is deliberately absent. It defaults to false
# (pkg/apis/options/header.go:6-7, 69), which makes the injector strip any
# client-supplied header of this name before setting it
# (pkg/middleware/headers.go:21-43, 54-66). A caller cannot smuggle its own
# setup token through the proxy.
injectRequestHeaders:
  - name: X-Bifrost-Setup-Token
    values:
      - secretSource:
          fromEnv: BIFROST_SETUP_TOKEN
