# The uids are Grafana Cloud's, because BugBoss's prefetch, mcp-grafana and
# the agent's own curl all address datasources by uid.
apiVersion: 1
datasources:
  - name: grafanacloud-logs
    uid: grafanacloud-logs
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 5000
  - name: grafanacloud-prom
    uid: grafanacloud-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
  - name: grafanacloud-traces
    uid: grafanacloud-traces
    type: tempo
    access: proxy
    url: http://tempo:3200
