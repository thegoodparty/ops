auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # A backfill batch reaches the ingester as one gRPC message.
  grpc_server_max_recv_msg_size: 67108864
  grpc_server_max_send_msg_size: 67108864
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2020-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# The backfill is hours old by design. Unordered writes accept an entry up to
# max_chunk_age / 2 behind a stream's newest, so 48h covers a 24h backfill.
ingester:
  max_chunk_age: 48h
  chunk_idle_period: 48h

limits_config:
  reject_old_samples: false
  unordered_writes: true
  allow_structured_metadata: true
  max_query_lookback: 0s
  max_query_length: 0h
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 128
  per_stream_rate_limit: 64MB
  per_stream_rate_limit_burst: 128MB
  max_entries_limit_per_query: 50000
  volume_enabled: true

pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false
