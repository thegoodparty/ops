# One observability stack for every run on this machine. Each run gets its
# own Grafana org whose datasources carry the run as a tenant (Loki, Tempo)
# or an enforced label (Prometheus, through prom-label-proxy), under the uids
# production uses.
name: evb-bugboss-evals
services:
  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./loki.yaml:/etc/loki/loki.yaml:ro"]
    ports: ["127.0.0.1:3310:3100"]
  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=7d
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9390:9090"]
  prom-label-proxy:
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.11.0
    command:
      - -label=eval_run
      - -header-name=X-Eval-Run
      - -upstream=http://prometheus:9090
      - -insecure-listen-address=0.0.0.0:8080
      - -enable-label-apis
    ports: ["127.0.0.1:9391:8080"]
  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml", "-multitenancy.enabled=true"]
    volumes: ["./tempo.yaml:/etc/tempo.yaml:ro"]
  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports: ["127.0.0.1:3300:3000"]
