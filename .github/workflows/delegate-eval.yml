name: Delegate eval

on:
  issue_comment:
    types: [created]

concurrency:
  group: delegate-eval-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write

jobs:
  eval:
    if: |
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, 'delegate eval')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # The comment body is attacker-controlled text. It reaches the shell as
      # an environment variable, never as template substitution into the
      # script, so nothing in it can execute.
      - name: Parse trigger
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          rest=$(printf '%s' "$COMMENT_BODY" | head -n1 | tr -d '\r' | sed -e 's/^delegate eval//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$rest" ]; then
            suite=core
          elif printf '%s' "$rest" | grep -qE '^[a-z0-9-]+$'; then
            suite=$rest
          else
            echo "::error::Unrecognized trigger. Comment 'delegate eval' or 'delegate eval <suite>'."
            exit 1
          fi
          echo "suite=${suite}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: React with eyes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content=eyes

      - name: Resolve PR head sha
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_repo=$(gh api repos/${{ github.repository }}/pulls/${{ steps.parse.outputs.pr_number }} --jq '.head.repo.full_name')
          if [ "$head_repo" != "${{ github.repository }}" ]; then
            echo "::error::delegate eval runs the PR's code with live credentials, so it only runs on branches in this repo, not forks."
            exit 1
          fi
          sha=$(gh api repos/${{ github.repository }}/pulls/${{ steps.parse.outputs.pr_number }} --jq '.head.sha')
          echo "head_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "sha7=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout main (tooling)
        uses: actions/checkout@v6
        with:
          ref: main
          path: .

      - name: Checkout PR head (agent under test)
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pr/

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deps (main)
        run: npm ci

      - name: Install deps (pr)
        run: npm ci
        working-directory: pr/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-delegate-eval
          aws-region: us-west-2

      - name: Create GitHub App token for repo cloning
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DELEGATE_EVAL_APP_ID }}
          private-key: ${{ secrets.DELEGATE_EVAL_APP_PRIVATE_KEY }}
          owner: thegoodparty

      # The scenario list is fixed, so every eval replays the same cases. The
      # PR's own manifest wins when it has one, so a PR that adds a scenario
      # is evaluated on it.
      - name: Load scenarios
        id: scenarios
        env:
          REVIEW_BUCKET: delegate-reviews
          SUITE: ${{ steps.parse.outputs.suite }}
        run: |
          manifest=delegate/review/eval/scenarios.json
          if [ -f "pr/$manifest" ]; then manifest="pr/$manifest"; fi
          echo "manifest=${manifest}" >> "$GITHUB_OUTPUT"
          npm run -s review:eval -- cases scenarios \
            --manifest "$manifest" \
            --out ./eval/cases \
            --suite "$SUITE"

      # Main's results are cached in S3 per git tree of main's delegate/agents/,
      # so they are replayed only when reviewer code changed (or a scenario is
      # new). Pulled results land in results-main, and replay skips any case
      # that already has a result file there.
      - name: Pull main's eval cache
        id: cache
        env:
          REVIEW_BUCKET: delegate-reviews
          SUITE: ${{ steps.parse.outputs.suite }}
        run: |
          agents_tree=$(git rev-parse HEAD:delegate/agents)
          echo "agents_tree=${agents_tree}" >> "$GITHUB_OUTPUT"
          npm run -s review:eval -- cache pull \
            --suite "$SUITE" \
            --tree "$agents_tree" \
            --out ./eval/results-main

      # Both sides are replayed on the same scenarios: what production posted
      # at the time came from whatever agent version was live, and a failed
      # run posted nothing to compare against.
      - name: Replay main and PR head
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          REVIEW_BUCKET: delegate-reviews
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SUITE: ${{ steps.parse.outputs.suite }}
          AGENTS_TREE: ${{ steps.cache.outputs.agents_tree }}
        run: |
          # gh clones with the app token, but the follow-up git fetch of the
          # recorded sha needs it too, or private repos fail to check out.
          gh auth setup-git
          main_sha7=$(git rev-parse --short=7 HEAD)
          echo "main_sha7=${main_sha7}" >> "$GITHUB_ENV"
          npm run -s review:eval -- replay \
            --cases ./eval/cases \
            --out ./eval/results-main \
            --variant main-${main_sha7} \
            --concurrency 4 \
            --work-dir ${{ runner.temp }}/work-main &
          main_pid=$!
          (cd pr && npm run -s review:eval -- replay \
            --cases ../eval/cases \
            --out ../eval/results-pr \
            --variant pr-${{ steps.pr.outputs.sha7 }} \
            --concurrency 4 \
            --work-dir ${{ runner.temp }}/work-pr) &
          pr_pid=$!
          main_status=0; pr_status=0
          wait $main_pid || main_status=$?
          wait $pr_pid || pr_status=$?
          # Pushed even when a replay failed: errored results are skipped, the
          # rest are good and the failed cases are retried next eval.
          npm run -s review:eval -- cache push \
            --suite "$SUITE" \
            --tree "$AGENTS_TREE" \
            --out ./eval/results-main
          if [ $main_status -ne 0 ] || [ $pr_status -ne 0 ]; then exit 1; fi

      - name: Judge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          REVIEW_BUCKET: delegate-reviews
        run: |
          npm run -s review:eval -- judge \
            --cases ./eval/cases \
            --a ./eval/results-main \
            --b ./eval/results-pr \
            --label-a main-${main_sha7} \
            --label-b pr-${{ steps.pr.outputs.sha7 }} \
            --passes 4 \
            --concurrency 6 \
            --manifest ${{ steps.scenarios.outputs.manifest }} \
            --out ./eval/report.md \
            --pr-comment ./eval/comment.md \
            --run-url https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(cat ./eval/comment.md)
          pr=${{ steps.parse.outputs.pr_number }}
          existing_id=$(gh api --paginate repos/${{ github.repository }}/issues/${pr}/comments \
            --jq '.[] | select(.body | startswith("<!-- delegate-eval -->")) | .id' | sed -n 1p)
          if [ -n "$existing_id" ]; then
            gh api --method PATCH repos/${{ github.repository }}/issues/comments/${existing_id} \
              -f body="$body"
          else
            gh api --method POST repos/${{ github.repository }}/issues/${pr}/comments \
              -f body="$body"
          fi

      - name: Upload eval artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delegate-eval-${{ steps.pr.outputs.sha7 }}
          path: ./eval/

      - name: Remove eyes reaction
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reaction_id=$(gh api \
            repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            --jq '[.[] | select(.content == "eyes")] | first | .id // empty')
          if [ -n "$reaction_id" ]; then
            gh api --method DELETE \
              repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions/${reaction_id}
          fi

  # The known-answer cases in expected/manifest.json, run against the PR head
  # on their own runner so they add no wall time. Scored on outcome alone and
  # posted as a separate comment.
  expected:
    if: |
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, 'delegate eval')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Resolve PR head sha
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          head_repo=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER} --jq '.head.repo.full_name')
          if [ "$head_repo" != "${{ github.repository }}" ]; then
            echo "::error::delegate eval runs the PR's code with live credentials, so it only runs on branches in this repo, not forks."
            exit 1
          fi
          sha=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER} --jq '.head.sha')
          echo "head_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "sha7=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout main (cases and scoring)
        uses: actions/checkout@v6
        with:
          ref: main
          path: .

      - name: Checkout PR head (agent under test)
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pr/

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deps (main)
        run: npm ci

      - name: Install deps (pr)
        run: npm ci
        working-directory: pr/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-delegate-eval
          aws-region: us-west-2

      - name: Create GitHub App token for repo cloning
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DELEGATE_EVAL_APP_ID }}
          private-key: ${{ secrets.DELEGATE_EVAL_APP_PRIVATE_KEY }}
          owner: thegoodparty

      # Main's answers to the same cases are the baseline each case is read
      # against. They are cached per git tree of main's delegate/agents/, and
      # also keyed on the tree of the expected/ directory, so a changed case
      # definition never reuses an answer to the old one.
      - name: Pull main's expected-result cache
        id: cache
        env:
          REVIEW_BUCKET: delegate-reviews
        run: |
          agents_tree=$(git rev-parse HEAD:delegate/agents)
          cases_tree=$(git rev-parse HEAD:delegate/review/eval/expected)
          echo "agents_tree=${agents_tree}" >> "$GITHUB_OUTPUT"
          echo "suite=expected-${cases_tree:0:12}" >> "$GITHUB_OUTPUT"
          echo "main_sha7=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          npm run -s review:eval -- cache pull \
            --suite "expected-${cases_tree:0:12}" \
            --tree "$agents_tree" \
            --layout runs \
            --out ./eval-expected-main

      - name: Run expected-result cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          REVIEW_BUCKET: delegate-reviews
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SUITE: ${{ steps.cache.outputs.suite }}
          AGENTS_TREE: ${{ steps.cache.outputs.agents_tree }}
        run: |
          gh auth setup-git
          npm run -s review:expect -- \
            --mode replay \
            --runs 3 \
            --concurrency 5 \
            --variant main-${{ steps.cache.outputs.main_sha7 }} \
            --out ./eval-expected-main \
            --work-dir ${{ runner.temp }}/work-expected-main &
          main_pid=$!
          (cd pr && npm run -s review:expect -- \
            --mode replay \
            --manifest ../delegate/review/eval/expected/manifest.json \
            --runs 3 \
            --concurrency 5 \
            --variant pr-${{ steps.pr.outputs.sha7 }} \
            --out ../eval-expected \
            --work-dir ${{ runner.temp }}/work-expected) &
          pr_pid=$!
          main_status=0; pr_status=0
          wait $main_pid || main_status=$?
          wait $pr_pid || pr_status=$?
          # Pushed even when a replay failed: errored runs are skipped, the
          # rest are good and the failed runs are retried next eval.
          npm run -s review:eval -- cache push \
            --suite "$SUITE" \
            --tree "$AGENTS_TREE" \
            --layout runs \
            --out ./eval-expected-main
          if [ $main_status -ne 0 ] || [ $pr_status -ne 0 ]; then exit 1; fi

      - name: Score against main's expectations
        run: |
          npm run -s review:expect -- \
            --mode score \
            --variant pr-${{ steps.pr.outputs.sha7 }} \
            --baseline ./eval-expected-main \
            --baseline-variant main-${{ steps.cache.outputs.main_sha7 }} \
            --out ./eval-expected

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          body=$(printf '<!-- delegate-eval-expected -->\n%s\n\n[Workflow run](https://github.com/%s/actions/runs/%s) has every result as an artifact.' \
            "$(cat ./eval-expected/report.md)" "${{ github.repository }}" "${{ github.run_id }}")
          existing_id=$(gh api --paginate repos/${{ github.repository }}/issues/${PR_NUMBER}/comments \
            --jq '.[] | select(.body | startswith("<!-- delegate-eval-expected -->")) | .id' | sed -n 1p)
          if [ -n "$existing_id" ]; then
            gh api --method PATCH repos/${{ github.repository }}/issues/comments/${existing_id} -f body="$body"
          else
            gh api --method POST repos/${{ github.repository }}/issues/${PR_NUMBER}/comments -f body="$body"
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delegate-eval-expected-${{ steps.pr.outputs.sha7 }}
          path: |
            ./eval-expected/
            ./eval-expected-main/
