# Zero-spend evidence on every PR that touches BugBoss or its evals: each
# scenario's hidden check is proved against omni, and the harness runs one
# offline pair end to end with the scripted model.
#
# pull_request runs the PR's own code, so this workflow holds no secrets, no
# environment and no AWS role. omni is public and needs no token. Offline
# means no GitHub: the sandbox is a local bare repo. See bugboss-evals/CLAUDE.md.
name: BugBoss evals CI

on:
  pull_request:
    paths:
      - "bugboss-evals/**"
      - "bugboss/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/bugboss-evals-ci.yml"

permissions:
  contents: read

concurrency:
  group: bugboss-evals-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.diff.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # A plain diff instead of a paths-filter action: no third-party code and
      # no pull-requests permission. The proof boots gp-api twice per scenario,
      # so it runs only when a scenario or its shared check code changed.
      - id: diff
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- bugboss-evals/scenarios bugboss-evals/core/scenario.ts; then
            echo "scenarios=false" >> "$GITHUB_OUTPUT"
          else
            echo "scenarios=true" >> "$GITHUB_OUTPUT"
          fi

  prove:
    needs: changes
    if: needs.changes.outputs.scenarios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # missed-merge and alert-vs-user-harm-paid-alert share another scenario's check.
        scenario: [ecanvasser-sync-timeout, users-read-invalid-zip, p2p-phone-list-late-cap, alert-vs-user-harm]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # Blobless: full history for both shas, blobs only for what is checked out.
      - run: git clone --filter=blob:none --no-checkout https://github.com/thegoodparty/omni.git /tmp/omni
      # prove.test.ts runs zero tests, and passes, for an id with no directory.
      - run: test -f "bugboss-evals/scenarios/${{ matrix.scenario }}/scenario.json"
      - run: npx tsx --test bugboss-evals/scenarios/prove.test.ts
        env:
          BUGBOSS_EVALS_OMNI_REPO: /tmp/omni
          BUGBOSS_EVALS_PROVE: ${{ matrix.scenario }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prove-${{ matrix.scenario }}
          path: /tmp/bugboss-evals-omni/*.log
          if-no-files-found: ignore

  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # compare.ts builds each ref in a git worktree of this checkout.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --no-audit --no-fund
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: git clone --filter=blob:none --no-checkout https://github.com/thegoodparty/omni.git /tmp/omni
      # Both sides are this PR: until the harness's BugBoss options are on
      # main, main's BugBoss cannot run against a stand-in at all.
      - name: Run
        # The judge's Bedrock client points at a stub but still signs, so it
        # needs some credentials to resolve. These are not real.
        env:
          AWS_ACCESS_KEY_ID: AKIAEVALFAKE
          AWS_SECRET_ACCESS_KEY: fake
          AWS_REGION: us-west-2
        run: |
          GRAFANA_ADMIN_PASSWORD="$(openssl rand -hex 16)" npx tsx bugboss-evals/sim/compare.ts run \
            --offline --stub /tmp/omni --baseline HEAD --candidate HEAD \
            --scenarios users-read-invalid-zip --reps 1 --out /tmp/evals
      - name: Every run reached a root cause
        run: |
          test -f /tmp/evals/results.json
          jq -r '.runs[] | "\(.scenario) rep \(.rep) \(.side): \(.end)"' /tmp/evals/results.json
          jq -e '(.runs | length) > 0 and all(.runs[]; .end == "root_cause")' /tmp/evals/results.json > /dev/null
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline
          path: |
            /tmp/evals/results.json
            /tmp/evals/runs/*/result.json
            /tmp/evals/runs/*/bugboss.log
            /tmp/evals/runs/*/slack.json
          if-no-files-found: warn
