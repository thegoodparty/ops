name: CI

on:
  pull_request:
  push:
    branches: ["main"]

# Serialize per ref, not globally: every push to main shares one group so
# two `pulumi up` runs can never race the stack's S3 lock, while PR branches
# stay independent. A single static group would put every PR in one queue, and
# GitHub keeps only one pending run per group — so PRs would cancel each other.
# cancel-in-progress is deliberately false: cancelling mid-`pulumi up` during
# an import pass is the failure mode (orphaned S3 lock + pending_operations
# entry), not the remedy. Queue behind the in-flight run instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: read

env:
  AWS_REGION: us-west-2
  IMAGE_URI: 333022194791.dkr.ecr.us-west-2.amazonaws.com/delegate-worker:${{ github.sha }}

jobs:
  # Everything that executes repository code runs here, in a job with no AWS
  # credentials and no OIDC token to mint. `npm test` is `tsx --test` over every
  # `*.test.ts` file, including the ones under `deploy-workbench/`, whose tests
  # import the Pulumi code they exercise. That tree is de-owned (step 6 of
  # `docs/plan-gated-merges.md`), so a bot approval can merge it, and the place
  # its code executes must not be able to reach a credential.
  #
  # Until this was a job of its own, `npm test` ran in the job below, which
  # assumes `github-actions-pulumi-deploy` (`AdministratorAccess`). Putting the
  # tests before the credentials step was not enough on its own: the job held
  # `id-token: write` throughout, so a test could mint an OIDC token claiming
  # `deploy.yml@main` -- which is exactly what that role's trust policy accepts
  # (`deploy/components/ci-roles/policies.ts`) -- and assume the role itself.
  # The split is what makes the ordering hold against a token minted mid-job,
  # and it keeps any future de-owned path inside its own account.
  test:
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's rather than merging with
    # them, so `id-token: write` is dropped here. Do not add it back.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    # Run even when `test` failed, so the required `deploy` check reports a
    # failure rather than a skipped job. The guard below is what fails it; a
    # failing step stops the rest of the job before any credential is assumed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a green test job
        if: ${{ needs.test.result != 'success' }}
        run: |
          echo "test job result: ${{ needs.test.result }}"
          exit 1

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install and build before assuming the role, as before. Neither step
      # executes repository code: `npm ci` runs dependency install scripts,
      # which is one reason `package.json` and `package-lock.json` stay
      # code-owned, and `npm run build` only compiles (`tsc`, `esbuild`). The
      # build has to happen in this job because the worker image copies
      # `dist/delegate/` out of this checkout. Test execution, which does run
      # repository code, is in the `test` job above and gates this one.
      - run: npm ci
      - run: npm run build

      # No deploy role on pull_request. Both the ECR push and the deploy are
      # skipped there, so nothing before `main` needs it. This role is
      # near-admin (`sso:*`, `iam:*Role*`, `s3:*`, `secretsmanager:*`), and a
      # PR run executes PR-authored code, so it must not be reachable from an
      # unreviewed branch. See `docs/pr-previews.md`, steps 6 and 7.
      #
      # The docker build still logs in to ECR Public on every run. Anonymous
      # pulls of the base image are limited per IP and shared runners hit
      # 429s; logged in, the limit is per account. A PR run borrows the
      # read-only `github-actions-pulumi-preview` role for that, which any PR
      # can already assume and which can mint the ECR Public login token.
      - name: Configure AWS Credentials (ECR Public login)
        if: ${{ github.event_name == 'pull_request' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-pulumi-preview
          aws-region: us-west-2

      - name: Configure AWS Credentials
        if: ${{ github.event_name != 'pull_request' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-pulumi-deploy
          aws-region: us-west-2

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Login to Amazon ECR
        if: ${{ github.event_name != 'pull_request' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Pulumi
        uses: pulumi/actions@v6
        with:
          pulumi-version: "^3"

      - name: Build Docker Image
        run: docker build -t "$IMAGE_URI" --platform linux/amd64 -f delegate/worker/Dockerfile .
      - name: Push Docker Image
        if: ${{ github.event_name != 'pull_request' }}
        run: docker push "$IMAGE_URI"

      - name: Deploy
        working-directory: deploy
        if: ${{ github.event_name != 'pull_request' }}
        run: ./deploy.sh
