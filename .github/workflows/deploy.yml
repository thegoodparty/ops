name: CI

on:
  pull_request:
  push:
    branches: ["main"]

# Serialize per ref, not globally: every push to main shares one group so
# two `pulumi up` runs can never race the stack's S3 lock, while PR branches
# stay independent. A single static group would put every PR in one queue, and
# GitHub keeps only one pending run per group — so PRs would cancel each other.
# cancel-in-progress is deliberately false: cancelling mid-`pulumi up` during
# an import pass is the failure mode (orphaned S3 lock + pending_operations
# entry), not the remedy. Queue behind the in-flight run instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: read

env:
  AWS_REGION: us-west-2
  IMAGE_URI: 333022194791.dkr.ecr.us-west-2.amazonaws.com/delegate-worker:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install, test and build BEFORE assuming the role. Every one of these
      # executes repository code -- `npm test` is `tsx --test` over every
      # `*.test.ts` file -- and the role carries `AdministratorAccess`
      # (`deploy/components/ci-roles.ts`). Run them after the credentials step
      # and any test file in the repo is an admin-credentialled shell.
      #
      # `.github/CODEOWNERS` lets its opted-out paths merge on a bot approval,
      # so this ordering is what keeps a bot-approved merge from reaching the
      # deploy role. Nothing below needs AWS except the docker build's ECR
      # Public login, the ECR push and the deploy itself.
      - run: npm ci
      - run: npm test
      - run: npm run build

      # No deploy role on pull_request. Both the ECR push and the deploy are
      # skipped there, so nothing before `main` needs it. This role is
      # near-admin (`sso:*`, `iam:*Role*`, `s3:*`, `secretsmanager:*`), and a
      # PR run executes PR-authored code, so it must not be reachable from an
      # unreviewed branch. See `docs/pr-previews.md`, steps 6 and 7.
      #
      # The docker build still logs in to ECR Public on every run. Anonymous
      # pulls of the base image are limited per IP and shared runners hit
      # 429s; logged in, the limit is per account. A PR run gets
      # `github-actions-ecr-public-login` for that, which can mint the ECR
      # Public login token and nothing else.
      - name: Configure AWS Credentials (ECR Public login)
        if: ${{ github.event_name == 'pull_request' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-ecr-public-login
          aws-region: us-west-2

      - name: Configure AWS Credentials
        if: ${{ github.event_name != 'pull_request' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-pulumi-deploy
          aws-region: us-west-2

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Login to Amazon ECR
        if: ${{ github.event_name != 'pull_request' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Pulumi
        uses: pulumi/actions@v6
        with:
          pulumi-version: "^3"

      - name: Build Docker Image
        run: docker build -t "$IMAGE_URI" --platform linux/amd64 -f delegate/worker/Dockerfile .
      - name: Push Docker Image
        if: ${{ github.event_name != 'pull_request' }}
        run: docker push "$IMAGE_URI"

      - name: Deploy
        working-directory: deploy
        if: ${{ github.event_name != 'pull_request' }}
        run: ./deploy.sh
