name: CI

on:
  pull_request:
  push:
    branches: ["main"]

# Serialize per ref, not globally: every push to main shares one group so
# two `pulumi up` runs can never race the stack's S3 lock, while PR branches
# stay independent. A single static group would put every PR in one queue, and
# GitHub keeps only one pending run per group — so PRs would cancel each other.
# cancel-in-progress is deliberately false: cancelling mid-`pulumi up` during
# an import pass is the failure mode (orphaned S3 lock + pending_operations
# entry), not the remedy. Queue behind the in-flight run instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: read

env:
  AWS_REGION: us-west-2
  IMAGE_URI: 333022194791.dkr.ecr.us-west-2.amazonaws.com/delegate-worker:${{ github.sha }}
  BUGBOSS_IMAGE_URI: 333022194791.dkr.ecr.us-west-2.amazonaws.com/bugboss:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # No AWS credentials on pull_request. The docker build uses the public
      # `node:22-alpine` base image, and both the ECR push and the deploy are
      # already skipped, so nothing before `main` needs the deploy role. This
      # role is near-admin (`sso:*`, `iam:*Role*`, `s3:*`,
      # `secretsmanager:*`), and a PR run executes PR-authored code, so it must
      # not be reachable from an unreviewed branch. See `docs/pr-previews.md`,
      # steps 6 and 7.
      - name: Configure AWS Credentials
        if: ${{ github.event_name != 'pull_request' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-pulumi-deploy
          aws-region: us-west-2

      - name: Login to Amazon ECR
        if: ${{ github.event_name != 'pull_request' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Pulumi
        uses: pulumi/actions@v6
        with:
          pulumi-version: "^3"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Build Docker Image
        run: docker build -t "$IMAGE_URI" --platform linux/amd64 -f delegate/worker/Dockerfile .
      - name: Push Docker Image
        if: ${{ github.event_name != 'pull_request' }}
        run: docker push "$IMAGE_URI"

      # Sequential on purpose. Both are emulated amd64 builds on an arm-free
      # runner either way, and running two at once just contends for the same
      # cores.
      - name: Build BugBoss Image
        run: docker build -t "$BUGBOSS_IMAGE_URI" --platform linux/amd64 -f bugboss/Dockerfile .
      - name: Push BugBoss Image
        if: ${{ github.event_name != 'pull_request' }}
        run: docker push "$BUGBOSS_IMAGE_URI"
      - name: Deploy
        working-directory: deploy
        if: ${{ github.event_name != 'pull_request' }}
        run: ./deploy.sh
