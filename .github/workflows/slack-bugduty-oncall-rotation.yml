name: Slack Bug Duty On-Call Rotation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
      timezone: "America/New_York"

jobs:
  eng-bugs-rotation:
    runs-on: ubuntu-latest
    env:
      SLACK_USERGROUP_ID: S0C8MGD4BQS
      ROTATION_START: "2026-10-12"
      ROTATION_CADENCE_WEEKS: "1"
      USERMAP_JSON: >
        {
          "Dan": "U09T5BQQUTH",
          "Daniel": "U09R9PH4ZRP",
          "Hugh": "U08BSR3MM3K",
          "Sanjay": "U0A34SFCV5E",
          "Stephen": "U09F6R9QA9G",
          "Swain": "U09HGPTHHAT",
          "Tomer": "UKP6FPANN"
        }
      OVERRIDES_JSON: >
        [
          {"start": "2026-10-25", "end": "2026-11-01", "dev": "Sanjay"},
          {"start": "2026-11-01", "end": "2026-11-08", "dev": "Hugh"}
        ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run script bug-rotation
        env:
          SLACK_ADMIN_USER_TOKEN: ${{ secrets.SLACK_ADMIN_USER_TOKEN }}
