name: Deploy workbench

# The filename is load bearing. github-actions-workbench-deploy pins
# token.actions.githubusercontent.com:job_workflow_ref to
# `thegoodparty/ops/.github/workflows/deploy-workbench.yml@refs/heads/main`,
# so renaming or moving this file makes the role unassumable, and the failure
# reads as a trust problem rather than as a rename.
#
# A separate workflow rather than a job in deploy.yml, for the same two
# reasons as deploy-org.yml: path filters are per workflow, and workbench
# changes should not queue behind the delegate image build.
#
# No pull_request trigger, and there cannot be one. The role is trusted only
# for the subject `repo:thegoodparty/ops:ref:refs/heads/main`; a pull_request
# run presents a pull_request ref and the AssumeRoleWithWebIdentity call
# fails. Review is the gate before merge here; the apply happens after.

on:
  push:
    branches: ["main"]
    paths:
      - "deploy-workbench/**"
      - ".github/workflows/deploy-workbench.yml"
      # Not part of the Pulumi project, but deployed by this workflow for the
      # trust reason in the header: the role is assumable only from this file,
      # so a separate workflow could not get credentials.
      - "scripts/enable-bedrock-models.ts"
      # The model list itself, which is where a model is actually added. This
      # was missing until 2026-09-23, and the comment above used to claim that
      # listing the script made editing the list enough. It did not: the list
      # lives in utils/, so adding Opus 5.5 would have merged, updated the IAM
      # policy through deploy.yml, and never subscribed the model. The result
      # is the exact failure the script exists to prevent, an invocation that
      # works for up to fifteen minutes and then turns into AccessDenied.
      - "utils/bedrock-models.ts"
      # The account id the provider assumes into. It lives outside this
      # project now, so an edit to it must still re-apply this stack.
      - "utils/accounts.ts"

# Its own group. This is a different stack with a different S3 lock from
# deploy.yml's and deploy-org.yml's, so there is nothing to serialize between
# them. cancel-in-progress is false for the same reason as in those two:
# cancelling mid-apply orphans the state lock.
concurrency:
  group: deploy-workbench-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2
  # The Bifrost image mirror. The upstream reference and the two literals the
  # mirror step builds the ECR URI from are duplicated from
  # `deploy-workbench/bifrost-image.ts` because Actions cannot import a
  # TypeScript module, and `bifrost-image.test.ts` fails if any of them drift.
  # The ECR URI itself is deliberately not a fourth literal: the mirror step
  # builds it from the ECR login registry plus BIFROST_REPOSITORY and
  # BIFROST_TAG, so it cannot point at a stale tag or repository. The upgrade
  # cadence is deliberate and reviewed, not automatic; see that file.
  BIFROST_UPSTREAM: maximhq/bifrost:v2.3.0@sha256:8f37e33a8caa85faf59a875605c61d1d934738e517d8fe96e2d9fcf6f0ef9098
  BIFROST_REPOSITORY: bifrost
  BIFROST_TAG: v2.3.0
  # The derived oauth2-proxy image built below. The repository name and the
  # upstream tag are duplicated from `deploy-workbench/oauth2-proxy-image.ts`
  # because Actions cannot import a TypeScript module, and
  # `oauth2-proxy-image.test.ts` fails if they drift. The tag itself is not a
  # literal: the build step derives it from the sha256 over the committed build
  # inputs (the allowlist, the Dockerfile and the alpha configuration), the
  # same files the module hashes in the same order, so a changed image is a new
  # tag and a new digest. The Dockerfile carries the upstream digest, guarded
  # against the module by the same test.
  OAUTH2_PROXY_REPOSITORY: bifrost-oauth2-proxy
  OAUTH2_PROXY_UPSTREAM_TAG: v7.15.5
  # The derived one-shot image that claims a fresh deployment (phase 2 item 11).
  # The repository name is duplicated from `deploy-workbench/bootstrap-image.ts`
  # because Actions cannot import a TypeScript module, and
  # `bootstrap-image.test.ts` fails if they drift. The tag is not a literal: the
  # build step derives it from the committed claim script and Dockerfile, the
  # same two files the module hashes in that order.
  BIFROST_BOOTSTRAP_REPOSITORY: bifrost-bootstrap

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No CreateAccount here, so nothing in this stack polls for minutes the
    # way deploy-org does. Well above the expected runtime, far below the six
    # hour default that would let a wedged run hold the lock all day. The
    # post-apply health check can wait up to its own 10-minute timeout, and it
    # must still be running when that timeout expires so it can print the
    # service's events: a job killed at the limit would lose the diagnosis.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # The first hop. This role lives in the management account; index.ts
      # makes the second hop into 024901689212 by assuming pulumi-deploy
      # through an explicit provider.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-workbench-deploy
          aws-region: us-west-2

      - name: Install Pulumi
        uses: pulumi/actions@v6
        with:
          pulumi-version: "^3"

      - run: npm ci

      # The targeted repositories pass. It runs on the first-hop credentials the
      # step above configured, because `deploy.sh` reads the Pulumi state
      # passphrase from SSM in the management account and then assumes
      # `pulumi-deploy` through the provider (`index.ts`), exactly as the full
      # apply below does. It comes before the workbench credentials and the
      # pushes on purpose: those two steps replace this session in the job
      # environment for every step after them.
      #
      # `--target` updates the resources it matches and leaves the rest of the
      # stack alone; the value is a glob over the resource *type* rather than a
      # list of names, so renaming a repository resource does not silently stop
      # matching it. `deploy-workflow-order.test.ts` checks the glob against the
      # URNs the three image modules declare.
      - name: Create the image repositories if the stack does not have them yet
        working-directory: deploy-workbench
        env:
          DEPLOY_TARGET: "urn:pulumi:*::*::aws:ecr/repository:Repository::*"
        run: ./deploy.sh

      # Everything the task definition can resolve is pushed BEFORE the apply
      # below, and the run has stopped if any of it could not be. That order is
      # load-bearing: the service runs one Fargate task with
      # `minimumHealthyPercent: 0` (`DEPLOYMENT_MINIMUM_HEALTHY_PERCENT` in
      # ecs.ts), so an apply that updates the service drains the only healthy
      # task before it starts the replacement -- because OSS Bifrost is
      # single-node. A task definition that names an image ECR does not have
      # yet therefore has nothing to replace the drained task with, and the ALB
      # has no healthy target: 503 from the edge, indefinitely, from a green
      # apply.
      #
      # That is exactly what happened on 2026-10-26. This workflow applied
      # first and built afterwards, so the merge of #353 rolled the service
      # onto `bifrost-bootstrap:v2.3.0-dc6dd0e438a6` before anything pushed
      # that tag, and the run then died in the build (deploy run 40329170411).
      # The old task was drained at 13:23 UTC and `bifrost.workbench.
      # goodparty.org` served 503 until someone rolled the service by hand.
      # `deploy-workflow-order.test.ts` pins the ordering.
      #
      # The one case the ordering above cannot serve, handled, rather than
      # probed for: a stack whose ECR repositories do not exist yet, because the
      # apply creates them. Nothing can be pushed before the first apply, and
      # pushing after it is the wrong order again -- so the run creates them
      # itself, with a `--target`ed apply limited to this stack's ECR
      # repositories. That apply matches no service, so there is nothing to
      # drain, and the pushes below have somewhere to push to.
      #
      # Unconditional, and that is the point. A conditional version (probe, then
      # create only if something is missing) has to read "the repository is not
      # there" out of a failed API call, and an expired session or a throttle
      # looks the same as a missing repository unless the error is parsed. Any
      # version of that check that gets it wrong skips a push and then lets the
      # apply drain the task onto an image ECR does not have, which is this
      # file's outage. One extra update per run, usually "no changes", removes
      # the whole class: nothing here can decide to skip a push, so a push that
      # cannot happen stops the run before the apply.
      #
      # Mirror the pinned Bifrost image into this account's ECR. The same
      # shape as the delegate worker's build/push in deploy.yml -- configure
      # credentials, log in to ECR, move the image -- with two differences:
      # nothing is built (the image is pulled from Docker Hub), and the source
      # is pinned by digest so the mirror is reproducible.
      #
      # The credentials are a second hop. The role configured above lives in
      # the management account; the repository lives here, so this assumes
      # `pulumi-deploy` the way deploy.sh and enable-bedrock-models.ts do.
      # `role-chaining` makes the action use the session from the step above
      # as the source rather than the runner's OIDC token. The apply takes the
      # first-hop session back in its own step below, because the action
      # exports this session into the job environment for every later step.
      #
      # `role-skip-session-tagging` because the trust grants only
      # `sts:AssumeRole`: the action tags a chained assume by default, which
      # needs `sts:TagSession` too, and neither side of this hop has it. See
      # the input comment below.
      - name: Configure AWS Credentials (workbench)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::024901689212:role/pulumi-deploy
          role-chaining: true
          # The action adds session tags to a chained `AssumeRole` by default
          # (`role-skip-session-tagging` defaults to false), and a tagged
          # assume needs `sts:TagSession` in addition to `sts:AssumeRole`.
          # Neither side grants it: `pulumi-deploy`'s trust names only
          # `sts:AssumeRole` (deploy-workbench/deploy-role.ts) and
          # `AssumeWorkbenchDeployRole` grants only `sts:AssumeRole`
          # (deploy/components/ci-roles/policies.ts). Without this the hop is
          # denied and the mirror never runs. Skipping the tags keeps the
          # trust narrowed rather than widening it for metadata nothing reads.
          role-skip-session-tagging: true
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Mirror the pinned Bifrost image
        env:
          # The registry the login step actually authenticated against, so the
          # URI is derived rather than a literal that can drift from the tag.
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          image_uri="${ECR_REGISTRY}/${BIFROST_REPOSITORY}:${BIFROST_TAG}"
          # The repository is immutable and this workflow runs on every
          # workbench change, not only on a digest bump, so a re-push of a tag
          # that is already there is rejected. Upstream release tags do not
          # move, so an existing tag means the same image is already mirrored.
          if aws ecr describe-images \
              --repository-name "$BIFROST_REPOSITORY" \
              --image-ids imageTag="$BIFROST_TAG" >/dev/null 2>&1; then
            echo "bifrost:$BIFROST_TAG is already mirrored; nothing to do."
            exit 0
          fi
          docker pull --platform linux/amd64 "$BIFROST_UPSTREAM"
          # `docker pull` of a reference that carries both a tag and a digest
          # resolves the digest and records the image locally under the digest
          # alone: the pull prints "Downloaded newer image for
          # maximhq/bifrost@sha256:..." and no `maximhq/bifrost:$BIFROST_TAG`
          # tag exists afterwards, so `docker tag maximhq/bifrost:$BIFROST_TAG`
          # fails with "No such image" (deploy run 38812637149). Tag the digest
          # reference the pull actually created. The tag is only the
          # destination tag in ECR here; the digest is what pins the content.
          upstream_repository="${BIFROST_UPSTREAM%@*}"
          upstream_repository="${upstream_repository%:*}"
          upstream_digest="${BIFROST_UPSTREAM##*@}"
          docker tag "${upstream_repository}@${upstream_digest}" "$image_uri"
          docker push "$image_uri"

      # Build and push the derived oauth2-proxy image that bakes in the admin
      # allowlist and the alpha configuration that carries the provider, the
      # upstream and the injected setup-token header. Bifrost OSS has no OIDC
      # and the stock oauth2-proxy image has no inline email-list flag, so both
      # reach the sidecar as files in a derivative
      # (`deploy-workbench/bifrost/Dockerfile`). The Dockerfile carries the
      # pinned upstream digest; this step only builds the context and pushes
      # it.
      #
      # The tag is content-addressed over every committed build input, in the
      # order `OAUTH2_PROXY_CONTENT_INPUTS` in `oauth2-proxy-image.ts` lists
      # them, so the immutable repository accepts a push whenever the image's
      # content changes and this step skips when the same content is already
      # built. A fixed tag would make the second edit unpushable; a digest over
      # the allowlist alone would have kept naming an image without the alpha
      # configuration after this change.
      #
      # Same second-hop credentials as the mirror step above: the ECR login
      # authenticated against this account, so ECR_REGISTRY is its registry.
      - name: Build and push the derived oauth2-proxy image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          content_digest="$(cat deploy-workbench/bifrost/allowed-emails.txt deploy-workbench/bifrost/Dockerfile deploy-workbench/bifrost/alpha-config.yaml | sha256sum | cut -c1-12)"
          image_tag="${OAUTH2_PROXY_UPSTREAM_TAG}-${content_digest}"
          image_uri="${ECR_REGISTRY}/${OAUTH2_PROXY_REPOSITORY}:${image_tag}"
          if aws ecr describe-images \
              --repository-name "$OAUTH2_PROXY_REPOSITORY" \
              --image-ids imageTag="$image_tag" >/dev/null 2>&1; then
            echo "oauth2-proxy:$image_tag is already built; nothing to do."
            exit 0
          fi
          docker build --platform linux/amd64 -t "$image_uri" deploy-workbench/bifrost
          docker push "$image_uri"

      # Build and push the derived bootstrap image that claims a fresh
      # deployment: the one-shot container that creates the first admin account
      # from inside the task (phase 2 item 11). It is derived from the same
      # pinned Bifrost release plus curl and jq, because the Alpine runtime
      # ships neither and the claim has to round-trip the live config.
      #
      # The tag is content-addressed over both committed inputs, so a change to
      # the script or the Dockerfile is a new tag and a push, while a re-run
      # with neither changed skips. The digest is `cat` in the same order the
      # module hashes them, with nothing between the two files.
      #
      # This is the image whose ordering cost the outage this workflow now
      # guards against: its tag moves whenever the claim script or its
      # Dockerfile changes, which is exactly the moment the task definition
      # starts naming a tag nothing has pushed. It runs before the apply, with
      # the other two, so a build that fails stops the run while the old task
      # is still serving.
      #
      # The repository exists by the time this runs: the targeted apply above
      # creates any this stack does not have. A push that fails here is a failed
      # run, not a skipped push, because the apply below must not run without
      # this image in ECR.
      - name: Build and push the derived bootstrap image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          bootstrap_digest="$(cat deploy-workbench/bifrost/bootstrap.sh deploy-workbench/bifrost/bootstrap.Dockerfile | sha256sum | cut -c1-12)"
          image_tag="${BIFROST_TAG}-${bootstrap_digest}"
          image_uri="${ECR_REGISTRY}/${BIFROST_BOOTSTRAP_REPOSITORY}:${image_tag}"
          if aws ecr describe-images \
              --repository-name "$BIFROST_BOOTSTRAP_REPOSITORY" \
              --image-ids imageTag="$image_tag" >/dev/null 2>&1; then
            echo "bifrost-bootstrap:$image_tag is already built; nothing to do."
            exit 0
          fi
          docker build --platform linux/amd64 \
            -f deploy-workbench/bifrost/bootstrap.Dockerfile \
            -t "$image_uri" deploy-workbench/bifrost
          docker push "$image_uri"

      # The first-hop credentials again, deliberately. The image steps above
      # configured the chained `pulumi-deploy` session, and
      # `aws-actions/configure-aws-credentials` exports the session it obtains
      # into the job environment for every later step -- so without this the
      # apply below would run as the workbench role. It needs the management
      # account's role back: `deploy.sh` reads the Pulumi state passphrase from
      # SSM there, and the provider makes its own hop into 024901689212 from
      # `index.ts`. Same ARN as the first `Configure AWS Credentials` step; the
      # duplication is the point, since the ordering is what changed.
      - name: Configure AWS Credentials (first hop, for the apply)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-workbench-deploy
          aws-region: us-west-2

      # Only now: every image above is in ECR, or the run stopped before this.
      # This is the step that drains the running task, so it is the last thing
      # that may happen before the stack is known to be startable. `deploy.sh`
      # also runs the pre-apply secret check immediately before its `pulumi
      # up`, so an unresolvable Secrets Manager key stops the run before the
      # drain rather than at task launch.
      - name: Deploy
        working-directory: deploy-workbench
        run: ./deploy.sh

      # The apply is not the same thing as a running service. `pulumi up`
      # exits 0 once ECS has accepted the new task definition and service, not
      # once a task is healthy; on 2026-10-26 the run reported success while
      # `bifrost` sat at running 0 / desired 1 for about three hours. This
      # waits for one deployment whose rollout is COMPLETED and whose running
      # count equals desired, fails immediately if a rollout is FAILED, and
      # prints the service's recent events on failure. It fails the run, not
      # warns, and it is before Bedrock enablement so a broken service stops
      # the workflow before it mutates the account further.
      #
      # The script assumes `pulumi-deploy` itself for the `ecs:DescribeServices`
      # reads, using the first-hop session the apply left in the job. Doing the
      # hop inside the script rather than with another `configure-aws-credentials`
      # step keeps that first-hop session in place for the Bedrock step below,
      # which makes the same hop and does not trust the workbench role itself.
      - name: Verify the service returned to a steady state
        working-directory: deploy-workbench
        env:
          WORKBENCH_DEPLOY_ROLE_ARN: arn:aws:iam::024901689212:role/pulumi-deploy
        run: npx --no-install tsx scripts/verify-service.ts --timeout-seconds 600 --interval-seconds 10

      # Bedrock model access is not a Pulumi resource, so it cannot ride in
      # deploy.sh; see the header of the script for why none exists. Without
      # this step the script would be something a human had to remember, which
      # is the failure it was written to prevent: enablement half-done reads
      # as an intermittent AccessDenied rather than as missing setup.
      #
      # After the apply on purpose. Enablement does not depend on anything in
      # the stack, but a failed apply is a reason to stop rather than to carry
      # on mutating the account.
      #
      # It makes the second hop itself, assuming pulumi-deploy exactly as
      # index.ts does, so the first-hop credentials restored above are all it
      # needs.
      #
      # Idempotent, so running it on every workbench deploy is a handful of
      # availability reads once the models are entitled. It exits non-zero
      # when a model still needs its terms accepted in the console, which will
      # hold this workflow red until someone does it. That is deliberate: a
      # green deploy over a half-enabled account is the exact state this whole
      # step exists to make impossible.
      #
      # Worth naming, since merging now does it automatically: creating an
      # agreement accepts that model provider's terms on GoodParty's behalf.
      # The reviewed model list in the script is where that consent lives.
      - name: Enable Bedrock models
        run: APPLY=1 npm run script enable-bedrock-models
