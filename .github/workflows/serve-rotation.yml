on:
  schedule:
    - cron: "0 19 * * FRI"

jobs:
  serve-rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run script bug-rotation
        env:
          SLACK_ADMIN_USER_TOKEN: ${{ secrets.SLACK_ADMIN_USER_TOKEN }}
