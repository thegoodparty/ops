# Comment on an ops PR to run BugBoss from main against BugBoss from the PR
# and get one advisory table back:
#   `bugboss eval <scenario>`  one scenario, one rep, to close, $60 a run (two runs)
#   `bugboss eval`             every scenario, one rep, to PR opened, $25 a run
#   `bugboss eval full`        every scenario, three reps, to close, $60 a run
#
# issue_comment runs this file, and the harness, from main, so a PR cannot
# change how it is measured. The PR's BugBoss runs as an unprivileged user.
# GitHub is a fake on the runner, so no GitHub credential is involved. The
# only secret is ANTHROPIC_API_KEY, held by the harness's model proxy and
# never handed to the system under test. See bugboss-evals/CLAUDE.md.
name: BugBoss eval

on:
  issue_comment:
    types: [created]
  # A manual run with explicit bounds, for one scenario at a time while the
  # suite is new. Everything it spends is visible in the inputs.
  workflow_dispatch:
    inputs:
      pr:
        description: PR number whose head is the candidate; main is the baseline
        required: true
      scenarios:
        description: Comma-separated scenario ids, or "all"
        default: users-read-invalid-zip
      reps:
        description: Reps per scenario
        default: "1"
      until:
        description: Where each run stops
        type: choice
        options: [pr_opened, closed]
        default: closed
      cap_per_run_usd:
        description: Spend cap per run, in dollars
        default: "60"

permissions: {}

concurrency:
  group: bugboss-eval-${{ github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'bugboss eval') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      PR: ${{ github.event.issue.number || inputs.pr }}
    outputs:
      pr: ${{ github.event.issue.number || inputs.pr }}
      sha: ${{ steps.pr.outputs.sha }}
      until: ${{ steps.plan.outputs.until }}
      tier: ${{ steps.plan.outputs.until == 'pr_opened' && 'fast' || 'full' }}
      cap: ${{ steps.plan.outputs.cap }}
      # Reps and scenarios are matrix dimensions, so everything runs in parallel.
      reps: ${{ steps.plan.outputs.reps }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$PR" \
            --jq '"sha=\(.head.sha)", "fork=\(.head.repo.full_name != .base.repo.full_name)"' >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.fork == 'true'
        run: |
          echo "BugBoss evals do not run a fork's code." >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: bugboss-evals/scenarios
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.comment.body }}
          IN_SCENARIOS: ${{ inputs.scenarios }}
          IN_REPS: ${{ inputs.reps }}
          IN_UNTIL: ${{ inputs.until }}
          IN_CAP: ${{ inputs.cap_per_run_usd }}
        run: |
          all=$(ls -d bugboss-evals/scenarios/*/ | xargs -n1 basename | jq -R . | jq -sc .)
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$IN_SCENARIOS" = all ]; then scenarios=$all; else scenarios=$(tr ',' '\n' <<< "$IN_SCENARIOS" | sed 's/ //g' | jq -R . | jq -sc .); fi
            reps=$(seq 1 "$IN_REPS" | jq -sc .); until=$IN_UNTIL; cap=$IN_CAP
          elif [ "$BODY" = "bugboss eval full" ]; then
            scenarios=$all; reps='[1,2,3]'; until=closed; cap=60
          elif [ "$BODY" = "bugboss eval" ]; then
            scenarios=$all; reps='[1]'; until=pr_opened; cap=25
          else
            # `bugboss eval <scenario>`: one scenario, to close.
            want=${BODY#bugboss eval }
            if ! jq -e --arg s "$want" 'index($s) != null' <<< "$all" > /dev/null; then
              gh pr comment "$PR" --repo "${{ github.repository }}" --body "No scenario named \`$want\`. Known: $(jq -r 'join(", ")' <<< "$all")."
              exit 1
            fi
            scenarios=$(jq -nc --arg s "$want" '[$s]'); reps='[1]'; until=closed; cap=60
          fi
          { echo "scenarios=$scenarios"; echo "reps=$reps"; echo "until=$until"; echo "cap=$cap"; } >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$PR" --repo "${{ github.repository }}" \
            --body "Incident eval started for \`${{ steps.pr.outputs.sha }}\`: scenarios ${{ steps.plan.outputs.scenarios }}, reps ${{ steps.plan.outputs.reps }}, each run to ${{ steps.plan.outputs.until }} under \$${{ steps.plan.outputs.cap }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  eval:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One runner per scenario and rep: six omni checkouts, their installs
        # and the hidden check's fill one runner's disk, so this is the
        # smallest split, and reps in parallel keep a full tier to one run's
        # wall clock.
        scenario: ${{ fromJSON(needs.gate.outputs.scenarios) }}
        rep: ${{ fromJSON(needs.gate.outputs.reps) }}
    env:
      OUT: /tmp/bugboss-eval/out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - run: nohup sudo rm -rf /usr/share/dotnet > /dev/null 2>&1 &
      - run: git fetch --no-tags origin "pull/${{ needs.gate.outputs.pr }}/head"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --no-audit --no-fund
      # Every scenario sha by name, one commit deep: a proving fix may live
      # only on a pull request's ref. The sandbox is seeded from these
      # snapshots.
      - run: |
          git init -q /tmp/omni
          git -C /tmp/omni fetch -q --depth 1 --no-tags https://github.com/thegoodparty/omni.git $(jq -r '.omni[]' bugboss-evals/scenarios/*/scenario.json | sort -u)
      - id: base
        run: echo "sha=$(jq -r .omni.baseSha bugboss-evals/scenarios/${{ matrix.scenario }}/scenario.json)" >> "$GITHUB_OUTPUT"
      # omni's dependencies at the scenario's base, built once and kept across
      # comparisons: compare.ts skips the build when they are already there.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.OUT }}/prebuilt/${{ steps.base.outputs.sha }}
            ${{ env.OUT }}/npm-cache
          key: bugboss-eval-omni-${{ steps.base.outputs.sha }}
      - name: Create the user BugBoss runs as
        # The runner's home is 750, so without this the run-as user cannot
        # read the harness checkout it is handed scripts and repositories from.
        run: |
          sudo useradd --create-home bugboss-eval
          sudo chmod o+rx /home/runner
          mkdir -p /tmp/bugboss-eval && chmod 755 /tmp/bugboss-eval
      - run: |
          GRAFANA_ADMIN_PASSWORD=unused docker compose -f bugboss-evals/sim/stack/stack.yml pull -q
          docker pull -q postgres:16
      # The fake GitHub's GraphQL is the subset gh 2.96.0 sends.
      - run: |
          curl -fsSL -o /tmp/gh.deb https://github.com/cli/cli/releases/download/v2.96.0/gh_2.96.0_linux_amd64.deb
          sudo dpkg -i /tmp/gh.deb > /dev/null
          gh --version
      # Last, once nothing else needs the real GitHub: from here github.com is
      # the harness's fake, on 443, which Node may bind unprivileged.
      - run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
          echo "127.0.0.1 github.com api.github.com" | sudo tee -a /etc/hosts
      - name: Run
        env:
          UNTIL: ${{ needs.gate.outputs.until }}
          CAP: ${{ needs.gate.outputs.cap }}
          GH_TOKEN: ghs_bugbossevalfaketoken
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # The cap is per run. A prod incident cost about $55 to close and
          # about $3 bought six minutes of investigation.
          mode=(--until "$UNTIL" --spend-cap-per-run-usd "$CAP")
          GRAFANA_ADMIN_PASSWORD="$(openssl rand -hex 16)" npx tsx bugboss-evals/sim/compare.ts run \
            --runtime bugboss --baseline origin/main --candidate "${{ needs.gate.outputs.sha }}" \
            --scenarios "${{ matrix.scenario }}" --rep "${{ matrix.rep }}" "${mode[@]}" \
            --omni /tmp/omni --out "$OUT" --run-as bugboss-eval
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.scenario }}-${{ matrix.rep }}
          path: |
            ${{ env.OUT }}/results.json
            ${{ env.OUT }}/runs/*/result.json
            ${{ env.OUT }}/runs/*/activity.json
            ${{ env.OUT }}/runs/*/diff.patch
            ${{ env.OUT }}/runs/*/proxy.jsonl
            ${{ env.OUT }}/runs/*/*.log
            ${{ env.OUT }}/runs/*/state/*.log
            ${{ env.OUT }}/runs/*/slack.json
            ${{ env.OUT }}/runs/*/s3/**/*.jsonl
          if-no-files-found: warn

  report:
    needs: [gate, eval]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
      - env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ needs.gate.outputs.tier }}
        run: |
          files=$(ls results/*/results.json 2>/dev/null || true)
          found=$(echo "$files" | grep -c . || true)
          expected=$(( $(jq length <<< '${{ needs.gate.outputs.scenarios }}') * $(jq length <<< '${{ needs.gate.outputs.reps }}') ))
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "$files" ]; then
            body="Incident eval produced no results: $run_url"
          else
            body="$(npx tsx bugboss-evals/sim/compare.ts report --tier "$TIER" --baseline main --candidate "${{ needs.gate.outputs.sha }}" $files)"
            if [ "$found" -lt "$expected" ]; then
              body="> [!WARNING]"$'\n'"> Partial results: $found of $expected scenarios finished. The table omits the rest; the failures are in the [run log]($run_url)."$'\n\n'"$body"
            fi
          fi
          gh pr comment "${{ needs.gate.outputs.pr }}" --repo "${{ github.repository }}" --body "$body"
