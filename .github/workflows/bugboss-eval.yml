# Comment `bugboss eval` on an ops PR to run BugBoss from main against
# BugBoss from the PR, on every scenario, and get one advisory table back.
#
# issue_comment runs this file, and the harness, from main, so a PR cannot
# change how it is measured. The PR's BugBoss runs as an unprivileged user
# with a token scoped to the sandbox repo; the App key stays with the trusted
# minter. See bugboss-evals/CLAUDE.md.
name: BugBoss eval

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: bugboss-eval-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == 'bugboss eval' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" \
            --jq '"sha=\(.head.sha)", "fork=\(.head.repo.full_name != .base.repo.full_name)"' >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.fork == 'true'
        run: |
          echo "BugBoss evals do not run a fork's code." >&2
          exit 1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "BugBoss eval started for \`${{ steps.pr.outputs.sha }}\`: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  eval:
    needs: gate
    environment: bugboss-eval
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # One runner per scenario: six omni checkouts, their installs and the
        # hidden check's fill one runner's disk, so this is the smallest split.
        scenario: [ecanvasser-sync-timeout, users-read-invalid-zip, p2p-phone-list-late-cap]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --no-tags origin "pull/${{ github.event.issue.number }}/head"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --no-audit --no-fund
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-bugboss-eval
          role-duration-seconds: 21600
          aws-region: us-west-2
      - name: Create the user BugBoss runs as
        run: sudo useradd --create-home bugboss-eval
      - name: Mint sandbox-scoped GitHub tokens
        env:
          GITHUB_APP_ID: ${{ secrets.BUGBOSS_GP_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.BUGBOSS_GP_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.BUGBOSS_GP_PRIVATE_KEY }}
        run: |
          mkdir -p /tmp/bugboss-eval && chmod 755 /tmp/bugboss-eval
          nohup npx tsx bugboss-evals/sim/token.ts /tmp/bugboss-eval/github-token > /tmp/bugboss-eval/minter.log 2>&1 &
          for i in $(seq 60); do [ -s /tmp/bugboss-eval/github-token ] && exit 0; sleep 2; done
          cat /tmp/bugboss-eval/minter.log; exit 1
      - name: Run
        run: |
          GRAFANA_ADMIN_PASSWORD="$(openssl rand -hex 16)" npx tsx bugboss-evals/sim/compare.ts run \
            --baseline origin/main --candidate "${{ needs.gate.outputs.sha }}" \
            --scenarios "${{ matrix.scenario }}" --reps 3 \
            --token-file /tmp/bugboss-eval/github-token --out /tmp/bugboss-eval/out --run-as bugboss-eval
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.scenario }}
          path: |
            /tmp/bugboss-eval/out/results.json
            /tmp/bugboss-eval/out/runs/*/result.json
            /tmp/bugboss-eval/out/runs/*/bugboss.log
            /tmp/bugboss-eval/out/runs/*/slack.json
            /tmp/bugboss-eval/out/runs/*/s3/**/*.jsonl
          if-no-files-found: warn

  report:
    needs: [gate, eval]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls results/*/results.json 2>/dev/null || true)
          if [ -z "$files" ]; then
            body="BugBoss eval produced no results: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            body="$(npx tsx bugboss-evals/sim/compare.ts report --baseline main --candidate "${{ needs.gate.outputs.sha }}" $files)"
          fi
          gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$body"
