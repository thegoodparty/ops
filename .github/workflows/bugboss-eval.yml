# Comment on an ops PR to run BugBoss from main against BugBoss from the PR,
# on every scenario, and get one advisory table back:
#   `bugboss eval`       fast: one rep, each run stops once its PR opens, $40 cap
#   `bugboss eval full`  the whole lifecycle, three reps, $200 cap
#
# issue_comment runs this file, and the harness, from main, so a PR cannot
# change how it is measured. The PR's BugBoss runs as an unprivileged user.
# GitHub is a fake on the runner, so no GitHub credential is involved. The
# only secret is ANTHROPIC_API_KEY, held by the harness's model proxy and
# never handed to the system under test. See bugboss-evals/CLAUDE.md.
name: BugBoss eval

on:
  issue_comment:
    types: [created]
  # TEMPORARY, remove before merge: a push to the PR branch runs the fast
  # tier against PR #206 so the harness can be proven before it is on main.
  push:
    branches: [feat/bugboss-evals-basic]

permissions: {}

concurrency:
  group: bugboss-eval-${{ github.event.issue.number || 206 }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'push' ||
      (github.event.issue.pull_request &&
      contains(fromJSON('["bugboss eval","bugboss eval full"]'), github.event.comment.body) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      sha: ${{ github.event_name == 'push' && github.sha || steps.pr.outputs.sha }}
      tier: ${{ github.event.comment.body == 'bugboss eval full' && 'full' || 'fast' }}
    steps:
      - id: pr
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" \
            --jq '"sha=\(.head.sha)", "fork=\(.head.repo.full_name != .base.repo.full_name)"' >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.fork == 'true'
        run: |
          echo "BugBoss evals do not run a fork's code." >&2
          exit 1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.issue.number || 206 }}" --repo "${{ github.repository }}" \
            --body "Incident eval (${{ github.event.comment.body == 'bugboss eval full' && 'full' || 'fast' }}) started for \`${{ github.event_name == 'push' && github.sha || steps.pr.outputs.sha }}\`: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  eval:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One runner per scenario: six omni checkouts, their installs and the
        # hidden check's fill one runner's disk, so this is the smallest split.
        scenario:
          - users-read-invalid-zip
          - p2p-phone-list-late-cap
          - missed-merge
          - alert-vs-user-harm
          - alert-vs-user-harm-paid-alert
          - merge-behind
    env:
      OUT: /tmp/bugboss-eval/out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - run: nohup sudo rm -rf /usr/share/dotnet > /dev/null 2>&1 &
      - if: github.event_name != 'push'
        run: git fetch --no-tags origin "pull/${{ github.event.issue.number }}/head"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --no-audit --no-fund
      # Every scenario sha by name, one commit deep: a proving fix may live
      # only on a pull request's ref. The sandbox is seeded from these
      # snapshots.
      - run: |
          git init -q /tmp/omni
          git -C /tmp/omni fetch -q --depth 1 --no-tags https://github.com/thegoodparty/omni.git $(jq -r '.omni[]' bugboss-evals/scenarios/*/scenario.json | sort -u)
      - id: base
        run: echo "sha=$(jq -r .omni.baseSha bugboss-evals/scenarios/${{ matrix.scenario }}/scenario.json)" >> "$GITHUB_OUTPUT"
      # omni's dependencies at the scenario's base, built once and kept across
      # comparisons: compare.ts skips the build when they are already there.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.OUT }}/prebuilt/${{ steps.base.outputs.sha }}
            ${{ env.OUT }}/npm-cache
          key: bugboss-eval-omni-${{ steps.base.outputs.sha }}
      - name: Create the user BugBoss runs as
        run: |
          sudo useradd --create-home bugboss-eval
          mkdir -p /tmp/bugboss-eval && chmod 755 /tmp/bugboss-eval
      - run: |
          GRAFANA_ADMIN_PASSWORD=unused docker compose -f bugboss-evals/sim/stack/stack.yml pull -q
          docker pull -q postgres:16
      # The fake GitHub's GraphQL is the subset gh 2.96.0 sends.
      - run: |
          curl -fsSL -o /tmp/gh.deb https://github.com/cli/cli/releases/download/v2.96.0/gh_2.96.0_linux_amd64.deb
          sudo dpkg -i /tmp/gh.deb > /dev/null
          gh --version
      # Last, once nothing else needs the real GitHub: from here github.com is
      # the harness's fake, on 443, which Node may bind unprivileged.
      - run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
          echo "127.0.0.1 github.com api.github.com" | sudo tee -a /etc/hosts
      - name: Run
        env:
          TIER: ${{ needs.gate.outputs.tier }}
          JOBS: ${{ strategy.job-total }}
          GH_TOKEN: ghs_bugbossevalfaketoken
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Each job holds its even share of the comparison's cap.
          share() { awk -v cap="$1" -v jobs="$JOBS" 'BEGIN { printf "%.2f", cap / jobs }'; }
          case "$TIER" in
            fast) mode=(--reps 1 --until pr_opened --spend-cap-usd "$(share 40)") ;;
            full) mode=(--reps 3 --spend-cap-usd "$(share 200)") ;;
          esac
          GRAFANA_ADMIN_PASSWORD="$(openssl rand -hex 16)" npx tsx bugboss-evals/sim/compare.ts run \
            --runtime bugboss --baseline origin/main --candidate "${{ needs.gate.outputs.sha }}" \
            --scenarios "${{ matrix.scenario }}" "${mode[@]}" \
            --omni /tmp/omni --out "$OUT" --run-as bugboss-eval
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.scenario }}
          path: |
            ${{ env.OUT }}/results.json
            ${{ env.OUT }}/runs/*/result.json
            ${{ env.OUT }}/runs/*/activity.json
            ${{ env.OUT }}/runs/*/diff.patch
            ${{ env.OUT }}/runs/*/proxy.jsonl
            ${{ env.OUT }}/runs/*/*.log
            ${{ env.OUT }}/runs/*/state/*.log
            ${{ env.OUT }}/runs/*/slack.json
            ${{ env.OUT }}/runs/*/s3/**/*.jsonl
          if-no-files-found: warn

  report:
    needs: [gate, eval]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
      - env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ needs.gate.outputs.tier }}
        run: |
          files=$(ls results/*/results.json 2>/dev/null || true)
          found=$(echo "$files" | grep -c . || true)
          expected=$(ls bugboss-evals/scenarios/*/scenario.json | wc -l | tr -d ' ')
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "$files" ]; then
            body="Incident eval produced no results: $run_url"
          else
            body="$(npx tsx bugboss-evals/sim/compare.ts report --tier "$TIER" --baseline main --candidate "${{ needs.gate.outputs.sha }}" $files)"
            if [ "$found" -lt "$expected" ]; then
              body="> [!WARNING]"$'\n'"> Partial results: $found of $expected scenarios finished. The table omits the rest; the failures are in the [run log]($run_url)."$'\n\n'"$body"
            fi
          fi
          gh pr comment "${{ github.event.issue.number || 206 }}" --repo "${{ github.repository }}" --body "$body"
