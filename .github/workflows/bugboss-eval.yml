name: BugBoss eval

# Tier 1 BugBoss evals, started by a PR comment:
#
#   bugboss eval [aa] [scenarios=a,b] [reps=N]
#
# Baseline is the PR's base commit and candidate its head (`aa` runs the base
# against itself). The caps live in code, in `cli.ts plan`, not here, so a
# comment cannot talk its way past them. Each run is one ECS task on the
# bugboss-evals cluster (deploy/components/bugboss-evals.ts).

on:
  issue_comment:
    types: [created]

concurrency:
  group: bugboss-eval-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  ECR: 333022194791.dkr.ecr.us-west-2.amazonaws.com/bugboss-evals
  ROLE: arn:aws:iam::333022194791:role/github-actions-bugboss-eval
  BUCKET: goodparty-bugboss-evals
  CLUSTER: bugboss-evals
  TASK_FAMILY: bugboss-evals-run

jobs:
  plan:
    # A comment from outside the org would otherwise spend up to the cap.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'bugboss eval') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      refs: ${{ steps.plan.outputs.refs }}
      eval_id: ${{ steps.plan.outputs.eval_id }}
    steps:
      # issue_comment runs on the default branch, so this is trusted code.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Acknowledge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes >/dev/null

      # The comment body goes through env, never into the script text, so a
      # crafted comment cannot inject shell.
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          read -r BASE HEAD < <(gh pr view "$PR" --json baseRefOid,headRefOid \
            --jq '.baseRefOid + " " + .headRefOid')
          if ! npx tsx bugboss-evals/sim/cli.ts plan \
            --comment "$COMMENT" \
            --scenarios-dir bugboss-evals/scenarios \
            --baseline "$BASE" \
            --candidate "$HEAD" > plan.json 2> refusal.txt; then
            {
              echo "BugBoss eval refused:"
              echo
              cat refusal.txt
            } > body.md
            gh pr comment "$PR" --body-file body.md
            exit 1
          fi
          echo "plan=$(jq -c . plan.json)" >> "$GITHUB_OUTPUT"
          echo "refs=$(jq -c '[.runs[].ref] | unique' plan.json)" >> "$GITHUB_OUTPUT"
          echo "eval_id=$(jq -r .evalId plan.json)" >> "$GITHUB_OUTPUT"
          jq -r '"Starting \(.runs | length) runs, model spend capped at $\(.maxUsd)."' plan.json > body.md
          gh pr comment "$PR" --body-file body.md

  # Builds the BugBoss image for each variant. This runs PR-authored code
  # (`npm ci` lifecycle scripts, `tsc`, the PR's own Dockerfile), so the job
  # holds no id-token permission and no AWS credentials at all, and hands its
  # images on as artifacts rather than pushing them. Pushing from here would
  # mean assuming the role on a machine where PR code has already run, and a
  # process it left behind could read those credentials from a later step.
  build-variant:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - run: npm ci
      - run: npm run build

      - name: Build the BugBoss image
        run: |
          docker build --platform linux/amd64 -f bugboss/Dockerfile \
            -t "$ECR:bugboss-${{ matrix.ref }}" .
          docker save "$ECR:bugboss-${{ matrix.ref }}" | gzip > bugboss.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: bugboss-${{ matrix.ref }}
          path: bugboss.tar.gz
          retention-days: 1

  # The sim image and the runner come from the default branch only. The sim
  # image leaves out bugboss-evals/scenarios, because agent-authored CI runs
  # in it; the runner adds the scenarios back.
  build-sim:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      sim_image: ${{ steps.images.outputs.sim_image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build the sim and runner images
        id: images
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          SIM_IMAGE="$ECR:sim-${{ github.sha }}"
          docker build --platform linux/amd64 -f bugboss-evals/sim/compose/sim.Dockerfile \
            -t "$SIM_IMAGE" .
          docker build --platform linux/amd64 -f bugboss-evals/sim/compose/runner.Dockerfile \
            --build-arg SIM_IMAGE="$SIM_IMAGE" -t "$ECR:runner" .
          echo "sim_image=$SIM_IMAGE" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - run: |
          docker push "${{ steps.images.outputs.sim_image }}"
          docker push "$ECR:runner"

  # A fresh machine that has run no PR code, so assuming the role here is safe.
  push-variants:
    needs: [plan, build-variant]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bugboss-*
          path: images

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - env:
          REFS: ${{ needs.plan.outputs.refs }}
        run: |
          set -euo pipefail
          for ref in $(echo "$REFS" | jq -r '.[]'); do
            gunzip -c "images/bugboss-$ref/bugboss.tar.gz" | docker load
            docker push "$ECR:bugboss-$ref"
          done

  run:
    needs: [plan, build-sim, push-variants]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 21600

      # Both sides of a pair are started back to back, in plan order, so they
      # meet the same Bedrock latency. The task stops itself at the scenario's
      # wall-clock cap; the deadline here is the backstop for a stuck runner.
      - name: Start and wait for every run
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          EVAL_ID: ${{ needs.plan.outputs.eval_id }}
          SIM_IMAGE: ${{ needs.build-sim.outputs.sim_image }}
        run: |
          set -euo pipefail
          : > tasks.txt
          echo "$PLAN" | jq -c '.runs[]' | while read -r entry; do
            scenario=$(echo "$entry" | jq -r .scenario)
            ref=$(echo "$entry" | jq -r .ref)
            rep=$(echo "$entry" | jq -r .rep)
            run_id=$(echo "$entry" | jq -r .runId)
            command=$(jq -cn \
              --arg scenario "$scenario" \
              --arg image "$ECR:bugboss-$ref" \
              --arg sim "$SIM_IMAGE" \
              --arg rep "$rep" \
              --arg run "$run_id" \
              --arg out "s3://$BUCKET/runs/$EVAL_ID/$run_id/" \
              '["npx","tsx","bugboss-evals/sim/cli.ts","run",
                "--scenario",$scenario,"--image",$image,"--sim-image",$sim,
                "--rep",$rep,"--run-id",$run,"--out",$out,"--omni-bundle","auto"]')
            overrides=$(jq -cn --argjson command "$command" \
              '{containerOverrides:[{name:"runner",command:$command}]}')
            aws ecs run-task \
              --cluster "$CLUSTER" \
              --task-definition "$TASK_FAMILY" \
              --capacity-provider-strategy capacityProvider=bugboss-evals,weight=1 \
              --overrides "$overrides" \
              --started-by "bugboss-eval-$EVAL_ID" \
              --query 'tasks[0].taskArn' --output text >> tasks.txt
          done

          deadline=$(( $(date +%s) + 290 * 60 ))
          while true; do
            running=$(xargs aws ecs describe-tasks --cluster "$CLUSTER" \
              --query "tasks[?lastStatus!='STOPPED'].taskArn" --output text --tasks < tasks.txt)
            if [ -z "$running" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              for task in $running; do
                aws ecs stop-task --cluster "$CLUSTER" --task "$task" \
                  --reason "bugboss eval workflow deadline" >/dev/null
              done
              echo "stopped runs still going at the deadline: $running"
              break
            fi
            sleep 60
          done

          xargs aws ecs describe-tasks --cluster "$CLUSTER" \
            --query 'tasks[].[taskArn,containers[0].exitCode,stoppedReason]' \
            --output text --tasks < tasks.txt

  report:
    needs: [plan, run]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Judge and report
        env:
          EVAL_ID: ${{ needs.plan.outputs.eval_id }}
        run: |
          set -euo pipefail
          aws s3 sync "s3://$BUCKET/runs/$EVAL_ID/" "results/$EVAL_ID/"
          npx tsx bugboss-evals/sim/cli.ts report --dir "results/$EVAL_ID" --out report.md

      - name: Post the report
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: gh pr comment "$PR" --body-file report.md
