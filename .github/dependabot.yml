# Docker base images. Dependabot has no security updates for docker, so a limit
# of 0 never opens a PR.
#
# delegate/worker gets version updates, so a Node release (22.23.4 -> 22.23.5)
# arrives as a PR for a human to review; majors stay a deliberate bump.
# deploy-workbench/bifrost stays at 0 on purpose: oauth2-proxy is upgraded by
# hand, with its digest pinned in oauth2-proxy-image.ts and the workflow, and a
# test fails if a Dockerfile-only bump lands.
version: 2
updates:
  - package-ecosystem: docker
    directory: /delegate/worker
    schedule:
      interval: daily
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /deploy-workbench/bifrost
    schedule:
      interval: daily
    open-pull-requests-limit: 0
