# Docker base images only. Dependabot has no security updates for docker, so a
# limit of 0 would never open a PR. Version updates are on instead, so a Node
# security patch (22.23.4 -> 22.23.5) arrives as a PR. Majors (Node 22 -> 24,
# oauth2-proxy v7 -> v8) stay a human call.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /delegate/worker
      - /deploy-workbench/bifrost
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
