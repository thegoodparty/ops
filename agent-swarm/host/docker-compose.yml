# agent-swarm 2.10.0 on delegate-swarm.infra.goodparty.org
# Derived from docker-compose.example.yml at that tag. .env is rendered by
# render-env.sh from Secrets Manager:DELEGATE_SWARM; never edit .env by hand.
# Start with: ./up.sh  (docker compose --profile tls [--profile sso] up -d)

# Fixed so the volume names (agent-swarm_swarm_api_data and so on) do not
# depend on the directory.
name: agent-swarm

x-logging: &logging
  driver: awslogs
  options:
    awslogs-region: us-west-2
    awslogs-group: /delegate-swarm/containers
    awslogs-create-group: "false"
    tag: "{{.Name}}"
    mode: non-blocking
    max-buffer-size: 4m

x-agent-entrypoint: &agent-entrypoint
  - /bin/sh
  - -ec
  - |
    ID_FILE="/workspace/personal/.agent-id"
    if [ -n "$${AGENT_ID:-}" ]; then
      printf '%s\n' "$$AGENT_ID" > "$$ID_FILE"
    elif [ -s "$$ID_FILE" ]; then
      AGENT_ID=$$(cat "$$ID_FILE")
    else
      AGENT_ID=$$(cat /proc/sys/kernel/random/uuid)
      printf '%s\n' "$$AGENT_ID" > "$$ID_FILE"
    fi
    export AGENT_ID
    exec /docker-entrypoint.sh "$$@"
  - --

x-worker-env: &worker-env
  ANONYMIZED_TELEMETRY: "false"
  HARNESS_PROVIDER: ${HARNESS_PROVIDER:-pi}
  # Kept, though no agent runs an Anthropic model. Two things in the pinned
  # 2.10.0 image read it and there is nothing to replace it with yet: the pi
  # boot credential gate (checkPiMonoCredentials' permissive branch does not know
  # FIREWORKS_API_KEY, so without this the workers report "waiting for
  # credentials" forever), and internal-ai session summaries, whose credential
  # chain reaches the anthropic branch because no OpenRouter or OpenAI key is
  # set here. See the "Anthropic key" section of agent-swarm/README.md.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  # The pi harness's own key for the ONE model it may run. render-env.sh copies
  # it from the secret; compose has to enumerate it or nothing passes it into
  # the container.
  FIREWORKS_API_KEY: ${FIREWORKS_API_KEY}
  # The agent dir a non-root worker can write, where global-setup-script.sh
  # (root, before the privilege drop) puts models.json. A single explicit value
  # shared with that script; fireworks-residency.test.ts keeps the two equal.
  PI_CODING_AGENT_DIR: ${PI_CODING_AGENT_DIR:-/workspace/personal/.pi}
  API_KEY: ${API_KEY}
  MCP_BASE_URL: http://api:3013
  # Shared files at /afs. The API provisions the org, drive and each agent's
  # key in swarm config on boot, so only the URL is set here.
  AGENT_FS_API_URL: http://agent-fs:7433
  MEMORY_RATERS: ${MEMORY_RATERS-implicit-citation,explicit-self}
  # Git and gh authenticate as the GitHub App (delegate-gp[bot]) through the
  # gh-app-token helper that global-setup-script.sh installs.
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_NAME: ${GITHUB_NAME:-delegate-gp[bot]}
  GITHUB_EMAIL: ${GITHUB_EMAIL:-268660869+delegate-gp[bot]@users.noreply.github.com}
  CLICKUP_API_TOKEN: ${CLICKUP_API_TOKEN}
  CLICKUP_API_KEY: ${CLICKUP_API_TOKEN}
  GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}
  GRAFANA_URL: ${GRAFANA_URL:-https://goodparty.grafana.net}
  SWARM_URL: delegate-swarm.infra.goodparty.org
  APP_URL: ${APP_URL:-https://delegate-swarm.infra.goodparty.org}
  PUBLIC_MCP_BASE_URL: ${PUBLIC_MCP_BASE_URL:-https://delegate-swarm.infra.goodparty.org}
  # Every AWS SDK and CLI call in a worker assumes the aws-config DEFAULT
  # profile, which is Bedrock-only, with the instance credentials from IMDS
  # (hop limit 2). Production reads are then an explicit `AWS_PROFILE=prod-read`
  # on the command that needs them. See aws-config.
  AWS_CONFIG_FILE: /etc/delegate-swarm/aws-config
  AWS_SDK_LOAD_CONFIG: "1"
  # pi's Bedrock provider reads AWS_REGION and refuses to fabricate one, so
  # without this a Bedrock model selection fails at the region check rather
  # than at inference. compose enumerates the container's env, so the host's
  # Environment=AWS_REGION in agent-swarm.service does not reach here.
  # Deliberately absent: BEDROCK_AUTH_MODE, and any Bedrock value for
  # MODEL_OVERRIDE. Fireworks stays the default every agent runs, and Bedrock
  # is chosen per agent or per task; set it in swarm_config on the agent that
  # needs it rather than here, because either key set here flips the boot gate
  # for all three agents at once. BEDROCK_AUTH_MODE=sdk would be fatal here
  # specifically: that branch runs runBedrockSdkProbeAndEnumerate, which calls
  # ListFoundationModels and ListInferenceProfiles, and the Bedrock role is
  # granted only the four invoke actions (no bedrock:List*/Get*, deliberately).
  # The probe would fail AccessDenied on every tick and park the worker in
  # credential-wait forever. Left unset, a Bedrock miss surfaces on the task
  # that chose a Bedrock model and nothing else is affected.
  AWS_REGION: ${AWS_REGION:-us-west-2}

# Built by up.sh from worker-patch/ on top of the upstream worker image. The
# tag changes with the version or the patch, which is what makes compose
# recreate the agents; an unchanged tag is not rebuilt.
x-worker-base: &worker-base
  image: "delegate-swarm-worker:${AGENT_SWARM_VERSION:-2.10.0}-${WORKER_PATCH_HASH:?rendered by render-env.sh}"
  pull_policy: never
  entrypoint: *agent-entrypoint
  platform: linux/amd64
  stop_grace_period: 60s
  depends_on:
    api:
      condition: service_healthy
  restart: unless-stopped
  logging: *logging

services:
  # agent-fs: the swarm's shared file store, mounted as /afs in agents and
  # catalog scripts. Taken from docker-compose.example.yml at 2.10.0. Files live
  # in a local MinIO on the data volume, not in AWS. No ports are published:
  # only the API and the agents reach it, over the compose network. The MinIO
  # root login is upstream's default for the same reason; anything that can
  # reach MinIO can already read /afs through agent-fs.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - agent_fs_minio:/data
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  # Makes the bucket before agent-fs starts. Unlike upstream, versioning stays
  # off: the panel-wave scripts delete each recipient CSV and replies export
  # after use, and a versioned bucket would keep the phone numbers anyway. The
  # cost is agent-fs's diff and revert of file history.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/agentfs
      "
    logging: *logging

  agent-fs:
    image: ghcr.io/desplega-ai/agent-fs:0.18.24
    platform: linux/amd64
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      - AGENT_FS_HOME=/data
      - HOST=0.0.0.0
      - SERVER_HOST=0.0.0.0
      - PORT=7433
      - SERVER_PORT=7433
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=http://minio:9000
      - S3_BUCKET=agentfs
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_REGION=us-east-1
      - S3_PROVIDER=minio
      # Embeddings run in this container; nothing leaves the host.
      - EMBEDDING_PROVIDER=local
      - ANONYMIZED_TELEMETRY=false
      - DO_NOT_TRACK=1
    volumes:
      - agent_fs_data:/data
    # The local embedding model cannot be turned off and needs most of this.
    mem_limit: 1536m
    memswap_limit: 1536m
    healthcheck:
      # The image has node but no curl or wget. First boot downloads the
      # local embedding model before it listens.
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:7433/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    platform: linux/amd64
    command: --model-id nomic-ai/nomic-embed-text-v1.5 --max-client-batch-size 64
    volumes:
      - tei_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # First boot downloads the model from Hugging Face before listening.
      start_period: 600s
    restart: unless-stopped
    logging: *logging

  api:
    image: "ghcr.io/desplega-ai/agent-swarm:${AGENT_SWARM_VERSION:-2.10.0}"
    platform: linux/amd64
    stop_grace_period: 60s
    pids_limit: 1024
    # If the host still runs out of memory, the kernel kills an agent's build
    # before the API that holds the Slack socket.
    oom_score_adj: -500
    depends_on:
      tei:
        condition: service_started
      agent-fs:
        condition: service_healthy
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - API_KEY=${API_KEY}
      - AGENT_FS_API_URL=http://agent-fs:7433
      # 2.10.0 serves agent-fs at /agentfs, /share and /site (and turns on the
      # dashboard's Files page and Comb) whenever AGENT_FS_API_URL is set. That
      # publishes agent-fs outside the compose network, which this host does
      # not do yet, so pin it off. Caddy already routes the three prefixes.
      - AGENT_FS_PROXY=${AGENT_FS_PROXY:-false}
      # agent-swarm sends usage events to desplega by default, tagged with the
      # org name and the admin's email domain.
      - ANONYMIZED_TELEMETRY=false
      - RBAC_ENABLED=${RBAC_ENABLED:-true}
      - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY}
      - MCP_BASE_URL=${MCP_BASE_URL}
      - PUBLIC_MCP_BASE_URL=${PUBLIC_MCP_BASE_URL}
      - APP_URL=${APP_URL:-https://delegate-swarm.infra.goodparty.org}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - API_DRAIN_MAX_MS=${API_DRAIN_MAX_MS:-30000}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - EMBEDDING_API_BASE_URL=${EMBEDDING_API_BASE_URL:-http://tei:80/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text-v1.5}
      - MEMORY_RATERS=${MEMORY_RATERS-implicit-citation,explicit-self}
      - MEMORY_HYBRID_SEARCH=${MEMORY_HYBRID_SEARCH-1}
      - MEMORY_GRAPH_EXPANSION=${MEMORY_GRAPH_EXPANSION-1}
      - MEMORY_DEMOTION_FLOOR=${MEMORY_DEMOTION_FLOOR-1.0}
      - SLACK_DISABLE=${SLACK_DISABLE:-false}
      - SLACK_MODE=${SLACK_MODE:-socket}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - SLACK_ALLOWED_EMAIL_DOMAINS=${SLACK_ALLOWED_EMAIL_DOMAINS:-goodparty.org}
      - SLACK_ALERTS_CHANNEL=${SLACK_ALERTS_CHANNEL:-C0C6RUJ9VMK}
      # Without this, every untagged reply in a thread Delegate was ever tagged
      # in is routed back to it. DMs and the assistant pane are unaffected.
      - SLACK_THREAD_FOLLOWUP_REQUIRE_MENTION=${SLACK_THREAD_FOLLOWUP_REQUIRE_MENTION:-true}
      # Inbound GitHub App webhooks. render-env.sh sets GITHUB_DISABLE=false
      # only when the secret holds the App keys. GITHUB_APP_PRIVATE_KEY is
      # base64 of the .pem (the API accepts base64 or raw PEM; a multi-line
      # PEM does not survive .env).
      - GITHUB_DISABLE=${GITHUB_DISABLE:-true}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      - GITHUB_BOT_NAME=${GITHUB_BOT_NAME:-}
      - GITHUB_BOT_ALIASES=${GITHUB_BOT_ALIASES:-}
      # grafana-mcp is a compose-internal hostname; the MCP wrapper refuses
      # private-network URLs in production unless this is set.
      - ALLOW_PRIVATE_NETWORK_URLS=true
    ports:
      - "127.0.0.1:3013:3013"
    volumes:
      - swarm_api_data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:3013/health || wget -q --spider http://localhost:3013/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging: *logging

  lead:
    <<: *worker-base
    environment:
      <<: *worker-env
      AGENT_ID: ${LEAD_AGENT_ID:-}
      AGENT_ROLE: lead
      AGENT_NAME: delegate
      TEMPLATE_ID: official/lead
      MODEL_OVERRIDE: ${LEAD_MODEL_OVERRIDE}
      # The default is 2. Background triggers (ClickUp comments, schedules)
      # can hold both slots for long stretches and queue Slack mentions behind
      # them; most lead tasks are short model calls, not builds.
      MAX_CONCURRENT_TASKS: "10"
    # Without caps one agent's build fills the 32 GB host, the kernel drops
    # its file cache, and the single-threaded API stalls on disk for minutes.
    # A capped agent is OOM-killed inside its own container instead.
    mem_limit: 8g
    memswap_limit: 8g
    volumes:
      - ./aws-config:/etc/delegate-swarm/aws-config:ro
      - swarm_logs:/logs
      - swarm_shared:/workspace/shared
      - swarm_lead:/workspace/personal

  worker-coder:
    <<: *worker-base
    environment:
      <<: *worker-env
      AGENT_ID: ${CODER_AGENT_ID:-}
      AGENT_ROLE: worker
      TEMPLATE_ID: official/coder
      MODEL_OVERRIDE: ${WORKER_MODEL_OVERRIDE}
    mem_limit: 12g
    memswap_limit: 12g
    volumes:
      - ./aws-config:/etc/delegate-swarm/aws-config:ro
      - swarm_logs:/logs
      - swarm_shared:/workspace/shared
      - swarm_worker_coder:/workspace/personal

  worker-reviewer:
    <<: *worker-base
    environment:
      <<: *worker-env
      AGENT_ID: ${REVIEWER_AGENT_ID:-}
      AGENT_ROLE: worker
      TEMPLATE_ID: official/reviewer
      MODEL_OVERRIDE: ${WORKER_MODEL_OVERRIDE}
    # 6g before agent-fs. It mostly reads diffs; the 2g went to agent-fs and
    # MinIO so the API, tei and the kernel keep about 6g.
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
      - ./aws-config:/etc/delegate-swarm/aws-config:ro
      - swarm_logs:/logs
      - swarm_shared:/workspace/shared
      - swarm_worker_reviewer:/workspace/personal

  grafana-mcp:
    image: grafana/mcp-grafana@sha256:2ed63c4d9d67557c8ea6cc6988743ddd9008e248bd9842e760fec378a0b61062
    # --allowed-hosts: the image validates the Host header and defaults to
    # loopback only; the api reaches it as grafana-mcp:8000.
    command:
      - -t
      - streamable-http
      - --address
      - 0.0.0.0:8000
      - --allowed-hosts
      - grafana-mcp:8000,grafana-mcp
    environment:
      - GRAFANA_URL=https://goodparty.grafana.net
      - GRAFANA_SERVICE_ACCOUNT_TOKEN=${GRAFANA_SERVICE_ACCOUNT_TOKEN}
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.11.4@sha256:13ba145cba2f3e28fa801994876e4c086d1b95d5aa2a520a734765ffb6b12017
    profiles: ["tls"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      - SWARM_AUTH=${SWARM_AUTH:-open}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Per-person dashboard tokens, written by sync-dashboard-users.sh.
      - ./dashboard-tokens.caddy:/etc/caddy/dashboard-tokens.caddy:ro
      - /opt/agent-swarm/ui-dist:/srv/ui:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *logging

  # Google login in front of the dashboard (Caddy forward_auth, see
  # Caddyfile). Only started when render-env.sh finds the OAUTH2_PROXY_* keys.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    profiles: ["sso"]
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowed-emails.txt
      OAUTH2_PROXY_REDIRECT_URL: https://delegate-swarm.infra.goodparty.org/oauth2/callback
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_WHITELIST_DOMAINS: delegate-swarm.infra.goodparty.org
    volumes:
      - ./allowed-emails.txt:/etc/oauth2-proxy/allowed-emails.txt:ro
    restart: unless-stopped
    logging: *logging

volumes:
  agent_fs_minio:
  agent_fs_data:
  tei_data:
  caddy_data:
  caddy_config:
  swarm_api_data:
  swarm_logs:
  swarm_shared:
  swarm_lead:
  swarm_worker_coder:
  swarm_worker_reviewer:
